    <script>
      // SPA GitHub Pages redirect decode: restore the original path that
      // 404.html encoded into the query string.
      // Based on https://github.com/rafgraph/spa-github-pages
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
    <!-- iOS Safari: collapse address bar on scroll down, expand on scroll up -->
    <script>
      (function () {
        var ua = navigator.userAgent;
        var iOS =
          /iPad|iPhone|iPod/.test(ua) ||
          (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        if (!iOS) return;
        var startY = 0;
        var done = false;
        document.addEventListener(
          'touchstart',
          function (e) {
            startY = e.touches[0].clientY;
            done = false;
          },
          { passive: true },
        );
        document.addEventListener(
          'touchmove',
          function (e) {
            if (done) return;
            var dy = startY - e.touches[0].clientY;
            if (dy > 15) {
              window.scrollTo(0, 1);
              done = true;
            } else if (dy < -15) {
              window.scrollTo(0, 0);
              done = true;
            }
          },
          { passive: true },
        );
      })();
    </script>
